# Once a week: files proposed issues for gaps it finds. It never marks anything ready.
name: claude-planner

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: claude-planner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review ${{ github.repository }} against CLAUDE.md and its sources of truth, and file at most
            three new issues, each labelled proposed plus a kind and type label, for the most useful gaps:
            for example DwC-DP tables that no recipe or fixture covers, behaviour of dwcdp.py that the
            schemas or the DwC-DP guide section 3 require and it doesn't do, or docs that contradict the
            schemas. Read all open and closed issues first (`gh issue list --state all --limit 200`) and
            don't file a duplicate. Each issue cites its sources and says what done looks like. Don't
            change any files, and don't label anything ready.
          claude_args: |
            --max-turns 40
